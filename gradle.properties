# Свойства сборки Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Настройки Fabric — ПРОВЕРЬ актуальные версии на fabricmc.net/develop перед сборкой,
# если сборка выдаст ошибку "could not resolve" — значит версия устарела, замени на актуальную.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.16.10

# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=mobhighlight

# Dependencies
fabric_version=0.115.4+1.21.11
